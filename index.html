<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#08090d"><title>Wolffe TV v3</title><link rel="stylesheet" href="styles.css"></head><body>
<main class="shell"><header><div><p class="eyebrow">LOCAL CONTROL · v3</p><h1 id="tvName">WOLFFE TV</h1></div><div id="status" class="status checking"><span></span>CHECKING</div></header>
<section class="inputs" aria-label="TV inputs"><button class="tile primary" data-action="hdmi1"><span class="icon"></span><span class="name">APPLE TV</span><span class="port">HDMI 1 · ARC</span></button><div class="row"><button class="tile muted" data-action="hdmi2"><span class="name">UNUSED</span><span class="port">HDMI 2</span></button><button class="tile muted" data-action="hdmi3"><span class="name">UNUSED</span><span class="port">HDMI 3</span></button></div><button class="tile wii" data-action="av"><span class="icon">🎮</span><span class="name">WII</span><span class="port">AV · COMPOSITE</span></button></section>
<button id="settingsButton" class="settings"><span>⚙</span> TV SETTINGS</button><p id="message" class="message" aria-live="polite"></p></main>
<dialog id="remoteDialog"><div class="dialog-head"><h2>TV SETTINGS</h2><button id="closeDialog" aria-label="Close">×</button></div><p>Press Home, move to Settings, then use the navigation pad.</p><button class="home" data-action="home">⌂ HOME</button><div class="dpad"><button data-action="up" aria-label="Up">▲</button><button data-action="left" aria-label="Left">◀</button><button data-action="select" aria-label="OK">OK</button><button data-action="right" aria-label="Right">▶</button><button data-action="down" aria-label="Down">▼</button></div><button class="back" data-action="back">↩ BACK</button>
<details class="advanced"><summary>Advanced</summary><p>Resetting setup deletes the local TV name and IP configuration, then reopens setup in the Terminal window.</p><button id="resetSetup" class="danger">RESET SETUP</button></details></dialog>
<script src="app.js"></script></body></html>
